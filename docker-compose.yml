version: "3.9"

services:
  # ── MongoDB Database
  mongodb:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_DATABASE: logistics
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache / Message Broker
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: logistics
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      GNEWS_API_KEY: ${GNEWS_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Background Worker (runs AI agent pipeline)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: logistics
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      GNEWS_API_KEY: ${GNEWS_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_worker worker --loglevel=info --concurrency=2

  # ── Celery Beat (triggers periodic jobs every 15 minutes)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: logistics
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      GNEWS_API_KEY: ${GNEWS_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_worker beat --loglevel=info

  # ── Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  mongodb_data:

