name: CI Pipeline

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Migrations & Pytest (PostgreSQL + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logistics_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov flake8

      - name: Run Python Lint
        run: |
          flake8 backend/ --max-line-length=120 --exclude=venv,alembic,node_modules --ignore=E402,E501,W503,F401,F841 || true

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/logistics_ci
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          alembic upgrade head

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/logistics_ci
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-key-32-chars-long
          PYTHONPATH: .
        run: |
          pytest backend/tests/ -v

      - name: Run Model Evaluation Harness
        env:
          PYTHONPATH: .
        run: |
          python eval/run_eval.py

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
